name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Plugins need a Dart SDK that emits the new Wasm exception instructions.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: dev
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - run: dart pub get
      - name: Analyze
        run: |
          dart analyze packages/pumpkin_api packages/pumpkin_tools packages/wasm_tools packages/wasm_components example/teleport example/commons tool/runtime_check --fatal-warnings
      - name: Unit tests
        run: |
          dart test packages/wasm_components
          dart test example/teleport
          dart test example/commons
      - name: Build the example plugin (needs the checked-in dart_mappable output)
        working-directory: example/teleport
        run: dart run pumpkin_tools build
      - name: Build the commons plugin
        working-directory: example/commons
        run: dart run pumpkin_tools build
      - name: Validate the component
        run: >
          wasmtime compile
          -W component-model=y,gc=y,function-references=y,exceptions=y,component-model-async=y
          -o /tmp/teleport.cwasm example/teleport/build/teleport.wasm

      - name: Validate the commons component
        run: >
          wasmtime compile
          -W component-model=y,gc=y,function-references=y,exceptions=y,component-model-async=y
          -o /tmp/commons.cwasm example/commons/build/commons.wasm

  bindings:
    # The checked-in bindings must match what the generator produces.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: dev
      - uses: dtolnay/rust-toolchain@stable
      - run: dart pub get
      - run: tool/generate_bindings.sh
      - run: git diff --exit-code
