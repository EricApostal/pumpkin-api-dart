include: package:lints/recommended.yaml

analyzer:
  exclude:
    # Generated by tool/generate_bindings.sh; the style lints are not ours to fix.
    - '**/bindings.g.dart'
    - '**/events.g.dart'
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    prefer_relative_imports: true
