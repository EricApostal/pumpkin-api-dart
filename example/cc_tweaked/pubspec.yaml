name: cc_tweaked
description: "Server side of CC: Tweaked for Pumpkin, running CraftOS on a pure Dart Lua VM."
publish_to: none

environment:
  sdk: ^3.13.0-0

dependencies:
  crypto: ^3.0.7
  hooks: ^2.0.2
  wasm_tools:
  pumpkin_api:
    path: ../../packages/pumpkin_api
  pumpkin_neoforge:
    path: ../../packages/pumpkin_neoforge
  # The compat of another mod: `lib/src/compat/simulated_peripherals.dart`
  # adapts Simulated's peripherals to this package's `Peripheral`. The
  # dependency points this way (and not simulated -> cc_tweaked) so that
  # Simulated stays usable, and testable, without CC: see the header of that
  # file.
  simulated:
    path: ../simulated

# This package is deliberately not part of the repository's pub workspace, so
# the workspace-relative dependencies of the packages above are redirected here.
dependency_overrides:
  pumpkin_api:
    path: ../../packages/pumpkin_api
  wasm_components:
    path: ../../packages/wasm_components
  wasm_tools:
    path: ../../packages/wasm_tools
  simulated:
    path: ../simulated
  create:
    path: ../create
  sable:
    path: ../sable
  package_config: ^3.0.0

dev_dependencies:
  lints: ^6.1.0
  pumpkin_tools:
    path: ../../packages/pumpkin_tools
  test: ^1.25.6
