name: cc_tweaked
description: "Server side of CC: Tweaked for Pumpkin, running CraftOS on a pure Dart Lua VM."
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0-0

dependencies:
  crypto: ^3.0.7
  pumpkin_api:
    path: ../../packages/pumpkin_api
  pumpkin_neoforge:
    path: ../../packages/pumpkin_neoforge
  # The compat of another mod: `lib/src/compat/simulated_peripherals.dart`
  # adapts Simulated's peripherals to this package's `Peripheral`. The
  # dependency points this way (and not simulated -> cc_tweaked) so that
  # Simulated stays usable, and testable, without CC: see the header of that
  # file.
  simulated:
    path: ../simulated

dev_dependencies:
  lints: ^6.1.0
  pumpkin_tools:
    path: ../../packages/pumpkin_tools
  test: ^1.25.6

# The Lua core module (`native/lua/lua.wasm`, built from `native/lua/` by
# `native/lua/build.sh`) is linked into this package's component by
# `pumpkin_tools build`, which reads this block from the pubspec of the package
# it compiles.
#
# This must not be a `hook/build.dart`: a build hook runs for every package
# that depends on the package owning it, so the module would also be linked
# into the components of this plugin's dependents, where nothing imports `lua`
# and the link fails with `Expected compiled app to export {host_call}`.
pumpkin:
  core_modules:
    - name: lua
      path: native/lua/lua.wasm
